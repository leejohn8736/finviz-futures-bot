name: Finviz Futures Bot

on:
  workflow_dispatch:          # 깃허브 탭에서 수동 실행 버튼
  repository_dispatch:        # cron-job.org 외부 신호를 수신하는 설정[cite: 1]
    types: [wake_up]

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: 코드 가져오기
      uses: actions/checkout@v4[cite: 1]

    - name: 파이썬 준비하기
      uses: actions/setup-python@v5[cite: 1]
      with:
        python-version: '3.11'[cite: 1]

    - name: 필요 도구 설치하기
      run: |
        pip install curl_cffi

    - name: 로봇 출발 및 텔레그램 발송
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}[cite: 1]
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}[cite: 1]
      run: |
        python main.py[cite: 1]
