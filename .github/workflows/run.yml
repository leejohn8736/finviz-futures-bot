name: Finviz Futures Bot

on:
  workflow_dispatch:          # 깃허브 버튼 눌러서 직접 실행
  repository_dispatch:        # cron-job.org 외부 신호 처리
    types: [wake_up, trigger_briefing] # 두 가지 이벤트 신호를 모두 받도록 설정

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: 코드 가져오기
      uses: actions/checkout@v4

    - name: 파이썬 준비하기
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 필요 도구 설치하기
      run: |
        pip install curl_cffi

    - name: 로봇 출발 및 텔레그램 발송
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python main.py
